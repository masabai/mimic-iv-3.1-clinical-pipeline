version: 2

sources:
  # --------------------------------------------------------------------------
  # HOSPITAL MODULE SOURCE TARGETS
  # --------------------------------------------------------------------------
  - name: mimic_raw_hosp
    database: mimiciv_testing
    schema: mimiciv_hosp
    tables:
      - name: admissions
        description: "Patient hospitalizations tracking high-level timeline metrics."
        columns:
          - name: hadm_id
            description: "Unique surrogate key identifier for each distinct patient admission."
            
      - name: patients
        description: "Demographic registries containing centralized anchor metrics."
        columns:
          - name: subject_id
            description: "The primary operational anchor key linking all clinical events."

  # --------------------------------------------------------------------------
  # INTENSIVE CARE UNIT MODULE SOURCE TARGETS
  # --------------------------------------------------------------------------
  - name: mimic_raw_icu
    database: mimiciv_testing
    schema: mimiciv_icu  # <--- CRITICAL FIX: Directs dbt to the right schema on your server
    tables:
      - name: icustays
        description: "Intensive care unit stays mapping bed-level boundary tracking parameters."
        columns:
          - name: stay_id
            description: "Surrogate key pinpointing specific ICU ward residence timelines."
