services:
  # 1. The Database (Attached directly to Host Stack - Bypasses Firewall Blocks)
  postgres-db:
    image: postgres:15
    container_name: mimic_postgres
    network_mode: "host"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: mimiciv
      PGPORT: 5433
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Local LLM Service (Isolated Container)
  ollama-llm:
    image: ollama/ollama:latest
    container_name: mimic_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  # 3. Your Execution Engine (Prefect, dbt, GX)
  elt-pipeline:
    build: .
    container_name: mimic_pipeline
    network_mode: "host"
    volumes:
      - .:/app
      - /home/moesa/mimiciv_data:/data # Map your full dataset files here
    environment:
      - LOCAL_DOWNLOAD_DIR=/data
      - SLACK_WEBHOOK_URL=https://slack.com
      - OLLAMA_HOST=http://localhost:11434
    depends_on:
      - postgres-db
      - ollama-llm

volumes:
  pgdata:
  ollama_storage:
